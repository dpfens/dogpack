<div class="card">
  <div class="card-header">
    <div class="row g-2 align-items-center">
      <!-- Layer name: full width on mobile, auto width from sm+ -->
      <div class="col-12 col-sm-auto">
        <input
          type="text"
          class="form-control form-control-sm"
          style="min-width: 8rem"
          placeholder="Layer"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
        />
      </div>

      <!-- Blend mode: grows to fill on mobile, pushed right from sm+ -->
      <div class="col col-sm-auto ms-sm-auto">
        <select
          class="form-select form-select-sm"
          [value]="blend() ?? ''"
          (change)="blend.set($any($event.target).value || undefined)"
        >
          <option value="" disabled>Blend mode</option>
          @for (mode of blendModes; track mode) {
            <option [value]="mode">{{ mode }}</option>
          }
        </select>
      </div>

      <!-- Add-node dropdown: content width, sits beside blend mode -->
      <div class="col-auto">
        <div class="btn-group">
          <button
            type="button"
            class="btn btn-sm btn-primary dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="btl bt-plus me-1"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            @for (type of nodeTypes; track type.kind) {
              <li>
                <button class="dropdown-item" type="button" (click)="addNode(type.kind)">
                  {{ type.label }}
                </button>
              </li>
            }
          </ul>
        </div>
      </div>

      <!-- Preview: full width row on mobile, auto width from sm+ -->
      <div class="col-12 col-sm-auto">
        <button
          type="button"
          class="btn btn-primary btn-sm w-100"
          [disabled]="previewPending()"
          (click)="runPreview()"
        >
          @if (previewPending()) {
            <i class="btl bt-gear bt-spin bt-lg me-1" role="status"></i>
          } @else {
            <i class="btl bt-play bt-lg me-1" role="status"></i>
          }
          Preview
        </button>
      </div>
    </div>
  </div>

  <div class="card-body vstack gap-3">
    @if (instances().length === 0) {
      <p class="text-muted small mb-0 fst-italic">No nodes yet. Use "<i class="btl bt-plus mx-1"></i>" to get started.</p>
    }

    <div class="accordion">
      @for (entry of instances(); track entry.id) {
        <div class="accordion-item">
          <h2 class="accordion-header fs-6 position-relative">
            <button
              type="button"
              class="accordion-button collapsed py-2 px-3"
              style="font-size: 1rem; padding-right: 2.75rem"
              data-bs-toggle="collapse"
              [attr.data-bs-target]="'#dog-layer-collapse-' + entry.id"
              aria-expanded="false"
              [attr.aria-controls]="'dog-layer-collapse-' + entry.id"
            >
              <span class="badge text-bg-secondary text-capitalize">
                {{ entry.kind }}
              </span>
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-danger position-absolute top-50 translate-middle-y py-0 px-2"
              style="right: 2.75rem; z-index: 4"
              (click)="$event.stopPropagation(); remove(entry)"
              [attr.aria-label]="'Remove ' + entry.kind"
              [title]="'Remove ' + entry.kind"
            >
              <i class="btl bt-times me-1"></i>
            </button>
          </h2>

          <div
            [id]="'dog-layer-collapse-' + entry.id"
            class="accordion-collapse collapse"
          >
            <div class="accordion-body">
              <!-- The actual XDog/FDog/ADog/HDog/Layer component is relocated here
                   right after creation — see attach() in layer.ts. -->
              <div #slot></div>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Hidden mounting point components are first created into, before
         being relocated into their row's #slot above. -->
    <div class="d-none">
      <ng-container #container></ng-container>
    </div>
  </div>
</div>
