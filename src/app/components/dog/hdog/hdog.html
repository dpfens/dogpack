<div class="d-flex align-items-center justify-content-between">
  <span class="ff-display mb-3">HDoG</span>
  <button type="button" class="btn btn-primary btn-sm" [disabled]="previewPending()" (click)="runPreview()">
    @if (previewPending()) {
      <i class="btl bt-gear bt-spin bt-lg me-1" role="status"></i>
    } @else {
      <i class="btl bt-play bt-lg me-1" role="status"></i>
    }
    Preview
  </button>
</div>

<div class="mb-3">
  <label class="form-label">Preset</label>
  <select class="form-select" (change)="selectPreset($any($event.target).value)">
    <option value="">Custom</option>
    @for (name of presetNames; track name) {
      <option [value]="name">{{ name }}</option>
    }
  </select>
</div>

<div class="accordion mb-3">
  <div class="accordion-item">
    <h2 class="accordion-header fs-6">
      <button
        type="button"
        class="accordion-button collapsed"
        data-bs-toggle="collapse"
        data-bs-target="#hdog-fdog-collapse"
        aria-expanded="false"
        aria-controls="hdog-fdog-collapse"
      >
        FDoG (line drawing)
      </button>
    </h2>
    <div id="hdog-fdog-collapse" class="accordion-collapse collapse">
      <div class="accordion-body">
        <fdog [preset]="fdogPreset()" />
      </div>
    </div>
  </div>

  <div class="accordion-item">
    <h2 class="accordion-header fs-6">
      <button
        type="button"
        class="accordion-button collapsed"
        data-bs-toggle="collapse"
        data-bs-target="#hdog-adog-collapse"
        aria-expanded="false"
        aria-controls="hdog-adog-collapse"
      >
        ADoG (primary tone)
      </button>
    </h2>
    <div id="hdog-adog-collapse" class="accordion-collapse collapse">
      <div class="accordion-body">
        <adog [preset]="adogPreset()" />
      </div>
    </div>
  </div>
</div>

<div class="mb-3">
  <label class="form-label">s′ scale factor (secondary ADoG)</label>
  <param-slider
    [sliderMin]="paramRanges.adogSecondaryScaleFactor.recommendedMin"
    [sliderMax]="paramRanges.adogSecondaryScaleFactor.recommendedMax"
    [hardMin]="paramRanges.adogSecondaryScaleFactor.hardMin"
    [hardMax]="paramRanges.adogSecondaryScaleFactor.hardMax"
    [step]="paramRanges.adogSecondaryScaleFactor.step"
    [formControl]="adogSecondaryScaleFactor" />
  <div class="form-text">{{ hint() }}</div>
</div>
