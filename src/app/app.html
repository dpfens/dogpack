@if (sourceImage(); as image) {
  <div class="d-flex justify-content-end p-2 pe-3">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="reset()">
      New image
    </button>
  </div>

  <app-workbench [sourceImage]="image" />
} @else {
  <div
    class="landing d-flex flex-column align-items-center justify-content-center text-center"
    [class.dragging]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <h1 class="display-5 mb-2">DoG Studio</h1>
    <p class="text-body-secondary mb-4">
      Difference-of-Gaussians image exploration, right in your browser.
    </p>

    <label class="upload-dropzone p-5 rounded-4">
      <input type="file" accept="image/*" class="d-none" (change)="onFileSelected($event)" />

      <svg
        class="mb-2"
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path d="M12 16V4m0 0L7 9m5-5l5 5" stroke-linecap="round" stroke-linejoin="round" />
        <path
          d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <div class="fw-semibold">Drop an image here, or click to browse</div>
      <div class="text-body-secondary small">PNG, JPG, or WebP</div>
    </label>

    @if (error(); as message) {
      <div class="alert alert-danger mt-3 mb-0" role="alert">{{ message }}</div>
    }
  </div>
}
